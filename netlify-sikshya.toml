# Netlify configuration for Sikshya documentation
[build]
  publish = "docs/.vitepress/dist"
  command = "npm run docs:build"

[build.environment]
  NODE_VERSION = "18"

# Redirects for Sikshya plugin documentation.
# Canonical docs URL is https://sikshya.mantrabrain.com/docs/ (VitePress
# `base: '/docs/'`). All legacy paths 301 to that base.
[[redirects]]
  from = "/docs/*"
  to = "/docs/:splat"
  status = 200

# Legacy: pre-2026 deploy at docs.mantrabrain.com/sikshya-wordpress-plugin/*
[[redirects]]
  from = "/sikshya-wordpress-plugin/*"
  to = "/docs/:splat"
  status = 301

# Legacy: intermediate /plugins/sikshya/* slug, before the rename to /sikshya-lms/
[[redirects]]
  from = "/plugins/sikshya/docs/*"
  to = "/docs/:splat"
  status = 301

[[redirects]]
  from = "/plugins/sikshya/*"
  to = "/docs/:splat"
  status = 301

# Security headers for all documentation
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache headers for static assets
[[headers]]
  for = "/docs/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production]
  command = "npm run docs:build"

[context.deploy-preview]
  command = "npm run docs:build"
