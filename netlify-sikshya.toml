# Netlify configuration for Sikshya documentation
[build]
  publish = "docs/.vitepress/dist"
  command = "npm run docs:build"

[build.environment]
  NODE_VERSION = "18"

# Redirects for Sikshya plugin documentation
[[redirects]]
  from = "/plugins/sikshya/docs/*"
  to = "/plugins/sikshya/docs/:splat"
  status = 200

# Legacy redirects (if needed)
[[redirects]]
  from = "/sikshya-wordpress-plugin/*"
  to = "/plugins/sikshya/docs/:splat"
  status = 301

# Security headers for all documentation
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache headers for static assets
[[headers]]
  for = "/plugins/*/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production]
  command = "npm run docs:build"

[context.deploy-preview]
  command = "npm run docs:build"
