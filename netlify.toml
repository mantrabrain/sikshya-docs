[build]
  publish = "docs/docs/.vitepress/dist"
  command = "npm run docs:build"

[build.environment]
  NODE_VERSION = "18"
[[redirects]]
  from = "/*"
  to = "/docs/:splat"
  status = 200

# Legacy paths from the old `docs.mantrabrain.com/sikshya-wordpress-plugin/`
# host. Any visitor still hitting those URLs is now 301-forwarded to the
# new `/docs/` base on `sikshya.mantrabrain.com`.
[[redirects]]
  from = "/sikshya-wordpress-plugin/*"
  to = "/docs/:splat"
  status = 301

[[redirects]]
  from = "/sikshya-wordpress-plugin"
  to = "/docs/"
  status = 301

# Older intermediate redirect that pointed at the previous plugin slug
# (/plugins/sikshya/...). Forward to the new docs base too so nothing
# 404s during the URL migration.
[[redirects]]
  from = "/plugins/sikshya/*"
  to = "/docs/:splat"
  status = 301

[[redirects]]
  from = "/plugins/sikshya"
  to = "/docs/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/docs/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production]
  command = "npm run docs:build"

[context.deploy-preview]
  command = "npm run docs:build"
