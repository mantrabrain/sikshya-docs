[build]
  publish = "docs/docs/.vitepress/dist"
  command = "npm run docs:build"

[build.environment]
  NODE_VERSION = "18"
[[redirects]]
  from = "/*"
  to = "/docs/:splat"
  status = 200

[[redirects]]
  from = "/plugins/sikshya/*"
  to = "/plugins/sikshya/:splat"
  status = 200

[[redirects]]
  from = "/sikshya-wordpress-plugin/*"
  to = "/plugins/sikshya/:splat"
  status = 301

[[redirects]]
  from = "/sikshya-wordpress-plugin"
  to = "/plugins/sikshya/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/plugins/sikshya/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production]
  command = "npm run docs:build"

[context.deploy-preview]
  command = "npm run docs:build"
